name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/pokewatch
            git fetch origin master
            git reset --hard origin/master
            # .env is gitignored and survives `reset --hard`. JWT_SECRET is
            # required at boot (server.js exits if it's missing) — generate
            # and persist one here if it's not already set, so a droplet
            # that never had it set manually can't crash-loop on deploy.
            # Never overwrites an existing value.
            if ! grep -q '^JWT_SECRET=.\+' .env 2>/dev/null; then
              printf '\nJWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
              echo "[deploy] Generated a new JWT_SECRET (none was set)."
            fi
            npm install
            sudo systemctl restart pokewatch
            sleep 2
            systemctl is-active pokewatch
